<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEON ARENA — XO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* =============================================
       DESIGN TOKENS
       ============================================= */
    :root {
      --bg:       #06060d;
      --x:        #ff2d55;
      --xg:       rgba(255, 45, 85, 0.55);
      --xg2:      rgba(255, 45, 85, 0.15);
      --o:        #00e5ff;
      --og:       rgba(0, 229, 255, 0.55);
      --og2:      rgba(0, 229, 255, 0.15);
      --gold:     #ffd700;
      --goldg:    rgba(255, 215, 0, 0.5);
      --purple:   #8b5cf6;
      --purpleg:  rgba(139, 92, 246, 0.4);
      --glass:    rgba(255, 255, 255, 0.025);
      --gb:       rgba(255, 255, 255, 0.07);
      --text:     #f0f0ff;
      --muted:    #33334a;
      --muted2:   #55556e;
      --cell:     clamp(88px, 21vw, 124px);
      --gap:      10px;
      --r:        14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #110022 0%, var(--bg) 65%);
      font-family: 'Rajdhani', sans-serif;
      color: var(--text);
      overflow: hidden;
      position: relative;
      /* Subtle CRT scanlines */
      background-image:
        radial-gradient(ellipse at 50% 40%, #110022 0%, var(--bg) 65%),
        repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px);
    }

    /* =============================================
       CANVAS LAYERS
       ============================================= */
    #bg-canvas, #fx-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    #bg-canvas  { z-index: 0; }
    #fx-canvas  { z-index: 600; }

    /* =============================================
       FLASH OVERLAY
       ============================================= */
    #flash {
      position: fixed; inset: 0;
      z-index: 500;
      pointer-events: none;
      opacity: 0;
    }
    #flash.fx { animation: flash-anim 0.45s ease forwards; }
    #flash.cx { background: var(--x); }
    #flash.co { background: var(--o); }
    #flash.cg { background: var(--gold); }
    @keyframes flash-anim {
      0%   { opacity: 0.28; }
      100% { opacity: 0; }
    }

    /* =============================================
       MATCH OVERLAY
       ============================================= */
    .match-overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 300;
      background: rgba(4,4,12,0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: ov-bg-in 0.4s ease;
    }
    .match-overlay.hidden { display: none; }
    @keyframes ov-bg-in { from { opacity:0; } to { opacity:1; } }

    .ov-card {
      background: rgba(14, 8, 32, 0.95);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 26px;
      padding: 44px 56px;
      text-align: center;
      width: min(420px, 92vw);
      position: relative;
      overflow: hidden;
      animation: ov-card-in 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes ov-card-in {
      from { transform: scale(0.65) translateY(50px); opacity:0; }
      to   { transform: scale(1) translateY(0);       opacity:1; }
    }

    /* Animated top accent line */
    .ov-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--x), var(--purple), var(--o));
      background-size: 200% 100%;
      animation: accent-slide 3s linear infinite;
    }
    @keyframes accent-slide {
      0%   { background-position: 0% 0%; }
      100% { background-position: 200% 0%; }
    }

    /* Ambient inner glow */
    .ov-card.wx { box-shadow: inset 0 0 80px rgba(255,45,85,0.07),  0 0 60px rgba(255,45,85,0.1); }
    .ov-card.wo { box-shadow: inset 0 0 80px rgba(0,229,255,0.07),  0 0 60px rgba(0,229,255,0.1); }
    .ov-card.wd { box-shadow: inset 0 0 80px rgba(139,92,246,0.07), 0 0 40px rgba(0,0,0,0.4); }

    .ov-eyebrow {
      font-size: 0.62rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted2);
      margin-bottom: 16px;
    }

    .ov-bigmark {
      font-family: 'Orbitron', sans-serif;
      font-size: 5rem;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 10px;
      animation: mark-slam 0.6s 0.15s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes mark-slam {
      from { transform: scale(0) rotate(-20deg); opacity:0; }
      to   { transform: scale(1) rotate(0);      opacity:1; }
    }
    .ov-bigmark.x { color: var(--x); text-shadow: 0 0 30px var(--xg), 0 0 70px var(--xg); }
    .ov-bigmark.o { color: var(--o); text-shadow: 0 0 30px var(--og), 0 0 70px var(--og); }
    .ov-bigmark.d { color: var(--muted2); }

    .ov-h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .ov-sub {
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      color: var(--muted2);
      margin-bottom: 28px;
    }

    .ov-tally {
      display: flex;
      gap: 22px;
      justify-content: center;
      margin-bottom: 30px;
    }
    .ov-t-item { text-align: center; }
    .ov-t-item .tl { font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted2); margin-bottom: 2px; }
    .ov-t-item .tv { font-family: 'Orbitron', sans-serif; font-size: 1.9rem; font-weight: 700; }
    .ov-t-item:nth-child(1) .tv { color: var(--x); }
    .ov-t-item:nth-child(2) .tv { color: var(--muted2); }
    .ov-t-item:nth-child(3) .tv { color: var(--o); }

    .ov-btns { display: flex; gap: 10px; justify-content: center; }

    /* =============================================
       MAIN APP CONTAINER
       ============================================= */
    .app {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Screen shake applied here */
    .app.shake { animation: shake 0.45s ease; }
    @keyframes shake {
      0%   { transform: translate(0,0); }
      8%   { transform: translate(-6px, 2px) rotate(-0.4deg); }
      18%  { transform: translate(6px, -3px) rotate(0.4deg); }
      28%  { transform: translate(-5px, 3px) rotate(-0.3deg); }
      40%  { transform: translate(5px, -2px) rotate(0.3deg); }
      52%  { transform: translate(-3px, 2px); }
      64%  { transform: translate(3px, -2px); }
      78%  { transform: translate(-1px, 1px); }
      100% { transform: translate(0,0); }
    }

    /* =============================================
       TITLE
       ============================================= */
    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.6rem, 5.5vw, 2.6rem);
      font-weight: 900;
      letter-spacing: 0.22em;
      margin-bottom: 3px;
      background: linear-gradient(110deg, var(--x) 0%, var(--purple) 45%, var(--o) 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: grad-shift 5s ease infinite;
    }
    @keyframes grad-shift {
      0%,100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    .subtitle {
      font-size: 0.62rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted2);
      margin-bottom: 20px;
    }

    /* =============================================
       MATCH BAR (round pips)
       ============================================= */
    .match-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted2);
    }
    .pips { display: flex; gap: 6px; }
    .pip {
      width: 9px; height: 9px;
      border-radius: 50%;
      border: 1.5px solid var(--muted);
      background: transparent;
      transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }
    .pip.fx { background: var(--x); border-color: var(--x); box-shadow: 0 0 10px var(--xg), 0 0 22px var(--xg); animation: pip-pop 0.4s cubic-bezier(0.34,1.56,0.64,1); }
    .pip.fo { background: var(--o); border-color: var(--o); box-shadow: 0 0 10px var(--og), 0 0 22px var(--og); animation: pip-pop 0.4s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes pip-pop { from { transform: scale(0); } to { transform: scale(1); } }

    /* =============================================
       SCOREBOARD
       ============================================= */
    .scoreboard { display: flex; gap: 10px; margin-bottom: 18px; }

    .sc-card {
      background: var(--glass);
      border: 1px solid var(--gb);
      border-radius: 12px;
      padding: 9px 20px;
      text-align: center;
      min-width: 80px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
      backdrop-filter: blur(6px);
    }
    /* top accent */
    .sc-card::before {
      content: '';
      position: absolute;
      top: 0; left: 15%; right: 15%; height: 1.5px;
      border-radius: 2px;
      background: transparent;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .sc-card.ax { border-color: rgba(255,45,85,0.38); box-shadow: 0 0 22px rgba(255,45,85,0.18), 0 0 50px rgba(255,45,85,0.06), inset 0 0 20px rgba(255,45,85,0.04); transform: translateY(-3px) scale(1.03); }
    .sc-card.ax::before { background: var(--x); box-shadow: 0 0 8px var(--xg); }
    .sc-card.ao { border-color: rgba(0,229,255,0.38); box-shadow: 0 0 22px rgba(0,229,255,0.18), 0 0 50px rgba(0,229,255,0.06), inset 0 0 20px rgba(0,229,255,0.04); transform: translateY(-3px) scale(1.03); }
    .sc-card.ao::before { background: var(--o); box-shadow: 0 0 8px var(--og); }

    .sc-label { font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted2); margin-bottom: 2px; }
    .sc-icon  { font-size: 1rem; font-weight: 700; line-height: 1.3; }
    .sc-card:first-child .sc-icon { color: var(--x); text-shadow: 0 0 10px var(--xg); }
    .sc-card:last-child  .sc-icon { color: var(--o); text-shadow: 0 0 10px var(--og); }
    .sc-icon.d { color: var(--muted2); }
    .sc-num  { font-family: 'Orbitron', sans-serif; font-size: 1.45rem; font-weight: 700; color: var(--text); line-height: 1; }

    /* =============================================
       STATUS
       ============================================= */
    .status {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 16px;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--muted2);
    }
    .status.pop { animation: pop-in 0.35s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes pop-in {
      from { transform: scale(0.5); opacity:0; }
      to   { transform: scale(1);   opacity:1; }
    }
    .sm { font-family: 'Orbitron', sans-serif; font-size: 0.88rem; font-weight: 900; }
    .sm.x { color: var(--x); text-shadow: 0 0 10px var(--xg); }
    .sm.o { color: var(--o); text-shadow: 0 0 10px var(--og); }

    /* =============================================
       GRID WRAPPER & GRID
       ============================================= */
    .grid-wrap {
      border-radius: 22px;
      padding: 2px;
      position: relative;
      /* Animated neon border */
      background: conic-gradient(from 0deg, var(--x), var(--purple), var(--o), var(--purple), var(--x));
      background-size: 200% 200%;
      animation: border-rotate 6s linear infinite;
      box-shadow: 0 0 40px rgba(139,92,246,0.25), 0 0 80px rgba(139,92,246,0.08);
    }
    @keyframes border-rotate {
      from { filter: hue-rotate(0deg); }
      to   { filter: hue-rotate(360deg); }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, var(--cell));
      grid-template-rows:    repeat(3, var(--cell));
      gap: var(--gap);
      padding: var(--gap);
      background: rgba(10, 5, 25, 0.92);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      position: relative;
    }

    /* =============================================
       CELLS
       ============================================= */
    .cell {
      background: rgba(255,255,255,0.018);
      border: 1px solid rgba(255,255,255,0.055);
      border-radius: var(--r);
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }

    /* Inner shine */
    .cell::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--r);
      background: radial-gradient(circle at 40% 30%, rgba(255,255,255,0.07) 0%, transparent 65%);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .cell:not(.taken):hover::before { opacity: 1; }
    .cell:not(.taken):hover {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.14);
      transform: scale(1.05);
      box-shadow: 0 0 18px rgba(139,92,246,0.25);
    }

    /* Click ripple */
    .cell::after {
      content: '';
      position: absolute; inset: 0;
      border-radius: var(--r);
      background: rgba(255,255,255,0.12);
      opacity: 0; transform: scale(0);
    }
    .cell.ripple::after { transform: scale(1); opacity: 1; transition: 0s; }

    /* X cell */
    .cell.x { border-color: rgba(255,45,85,0.32); box-shadow: 0 0 18px var(--xg2), inset 0 0 18px rgba(255,45,85,0.04); animation: cell-pop 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    /* O cell */
    .cell.o { border-color: rgba(0,229,255,0.32); box-shadow: 0 0 18px var(--og2), inset 0 0 18px rgba(0,229,255,0.04); animation: cell-pop 0.3s cubic-bezier(0.34,1.56,0.64,1); }

    @keyframes cell-pop {
      0%   { transform: scale(0.88); }
      60%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    /* Winner cells */
    .cell.winner {
      animation: win-pulse 0.85s ease infinite alternate !important;
      border-color: var(--gold) !important;
      background: rgba(255,215,0,0.06) !important;
    }
    .cell.winner.x { box-shadow: 0 0 28px var(--goldg), 0 0 55px var(--xg2) !important; }
    .cell.winner.o { box-shadow: 0 0 28px var(--goldg), 0 0 55px var(--og2) !important; }
    @keyframes win-pulse {
      from { box-shadow: 0 0 12px var(--goldg); }
      to   { box-shadow: 0 0 40px var(--goldg), 0 0 80px rgba(255,215,0,0.2); }
    }

    .cell.taken { cursor: default; pointer-events: none; }
    .grid.over  { pointer-events: none; }

    /* =============================================
       SVG MARKS (animated draw-in)
       ============================================= */
    .mark-svg, .ghost-svg {
      position: absolute;
      width: 54%; height: 54%;
      overflow: visible;
      pointer-events: none;
    }

    /* Active marks – hidden until player clicks */
    .mark-svg { opacity: 0; }

    /* X lines */
    .xl { stroke: var(--x); stroke-width: 8.5; stroke-linecap: round; fill: none;
      stroke-dasharray: 80; stroke-dashoffset: 80;
      filter: drop-shadow(0 0 5px var(--x)) drop-shadow(0 0 12px var(--xg)); }

    /* O circle  circumference = 2π×32 ≈ 201 */
    .oc { stroke: var(--o); stroke-width: 7.5; stroke-linecap: round; fill: none;
      stroke-dasharray: 201; stroke-dashoffset: 201;
      filter: drop-shadow(0 0 5px var(--o)) drop-shadow(0 0 12px var(--og)); }

    /* Draw animations */
    .cell.x .mark-x { opacity: 1; }
    .cell.x .mark-x .xl1 { animation: draw-mark 0.22s ease forwards; }
    .cell.x .mark-x .xl2 { animation: draw-mark 0.22s 0.16s ease forwards; }
    .cell.o .mark-o { opacity: 1; }
    .cell.o .mark-o .oc  { animation: draw-arc  0.38s ease forwards; }
    @keyframes draw-mark { to { stroke-dashoffset: 0; } }
    @keyframes draw-arc  { to { stroke-dashoffset: 0; } }

    /* Ghost previews – fully drawn, shown faintly on hover */
    .ghost-svg { opacity: 0; transition: opacity 0.15s; }
    .ghost-svg .xl { stroke-dashoffset: 0; filter: none; }
    .ghost-svg .oc { stroke-dashoffset: 0; filter: none; }
    .grid.tx .cell:not(.taken):hover .ghost-x { opacity: 0.16; }
    .grid.to .cell:not(.taken):hover .ghost-o { opacity: 0.16; }

    /* =============================================
       WIN LINE SVG
       ============================================= */
    .wl-svg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
    }
    .wl-path {
      stroke: var(--gold); stroke-width: 4.5; stroke-linecap: round; fill: none;
      filter: drop-shadow(0 0 8px var(--gold)) drop-shadow(0 0 20px var(--goldg));
      stroke-dasharray: 600; stroke-dashoffset: 600;
      animation: draw-wl 0.55s 0.08s cubic-bezier(0.4,0,0.2,1) forwards;
    }
    @keyframes draw-wl { to { stroke-dashoffset: 0; } }

    /* =============================================
       CONTROLS
       ============================================= */
    .controls { margin-top: 22px; display: flex; gap: 8px; }

    .btn {
      padding: 10px 24px;
      border-radius: 50px;
      border: 1px solid transparent;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .btn::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.1);
      opacity: 0;
      transition: opacity 0.18s;
    }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.94) !important; }
    .btn:disabled { opacity: 0.28; cursor: default; pointer-events: none; }

    .btn-next {
      background: linear-gradient(135deg, var(--x), #ff6b8a);
      color: #fff;
      box-shadow: 0 4px 22px rgba(255,45,85,0.38);
      border-color: rgba(255,45,85,0.3);
    }
    .btn-next:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 6px 32px rgba(255,45,85,0.6); }

    .btn-new-match {
      background: linear-gradient(135deg, var(--purple), var(--o));
      color: #fff;
      box-shadow: 0 4px 22px rgba(139,92,246,0.4);
    }
    .btn-new-match:hover { transform: translateY(-2px); box-shadow: 0 6px 32px rgba(139,92,246,0.6); }

    .btn-ghost {
      background: transparent;
      color: var(--muted2);
      border-color: rgba(255,255,255,0.07);
    }
    .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.18); transform: translateY(-1px); }

    .btn-mute {
      background: transparent;
      color: var(--muted2);
      border-color: rgba(255,255,255,0.07);
      padding: 10px 14px;
      font-size: 0.95rem;
      letter-spacing: 0;
    }
    .btn-mute:hover { color: var(--text); border-color: rgba(255,255,255,0.18); }
    .btn-mute.off   { color: #222238; border-color: rgba(255,255,255,0.03); }

    /* =============================================
       FOOTER
       ============================================= */
    .footer { margin-top: 22px; font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; color: #1a1a2e; }
  </style>
</head>
<body>

  <!-- z-layer stack (back → front) -->
  <canvas id="bg-canvas"></canvas>
  <div     id="flash"></div>
  <canvas  id="fx-canvas"></canvas>

  <!-- Match result overlay -->
  <div class="match-overlay hidden" id="match-overlay">
    <div class="ov-card" id="ov-card">
      <p class="ov-eyebrow">Match Over · Best of 3</p>
      <div class="ov-bigmark" id="ov-bigmark">X</div>
      <h2  class="ov-h1"      id="ov-h1">Player X wins!</h2>
      <p   class="ov-sub"     id="ov-sub">First to 2 rounds</p>
      <div class="ov-tally">
        <div class="ov-t-item"><p class="tl">Player X</p><p class="tv" id="ov-x">0</p></div>
        <div class="ov-t-item"><p class="tl">Draws</p>   <p class="tv" id="ov-d">0</p></div>
        <div class="ov-t-item"><p class="tl">Player O</p><p class="tv" id="ov-o">0</p></div>
      </div>
      <div class="ov-btns">
        <button class="btn btn-new-match" id="ov-new-match">▶ New Match</button>
        <button class="btn btn-ghost"     id="ov-reset-btn">Reset All</button>
      </div>
    </div>
  </div>

  <!-- Main UI -->
  <div class="app" id="app">
    <h1 class="title">NEON ARENA</h1>
    <p  class="subtitle">Tic · Tac · Toe · Best of 3</p>

    <!-- Round tracker -->
    <div class="match-bar">
      <div class="pips" id="pips-x"><div class="pip"></div><div class="pip"></div></div>
      <span id="round-label">Round 1 of 3</span>
      <div class="pips" id="pips-o"><div class="pip"></div><div class="pip"></div></div>
    </div>

    <!-- Score cards -->
    <div class="scoreboard">
      <div class="sc-card" id="sc-x">
        <p class="sc-label">Player X</p>
        <p class="sc-icon">✕</p>
        <p class="sc-num" id="num-x">0</p>
      </div>
      <div class="sc-card" style="min-width:62px" id="sc-d">
        <p class="sc-label">Draws</p>
        <p class="sc-icon d">—</p>
        <p class="sc-num" id="num-d">0</p>
      </div>
      <div class="sc-card" id="sc-o">
        <p class="sc-label">Player O</p>
        <p class="sc-icon">○</p>
        <p class="sc-num" id="num-o">0</p>
      </div>
    </div>

    <!-- Status -->
    <div class="status" id="status">
      <span class="sm x">X</span><span>goes first</span>
    </div>

    <!-- Game grid -->
    <div class="grid-wrap">
      <div class="grid tx" id="grid">
        <!-- 9 cells – SVG marks injected by JS -->
        <div class="cell" data-i="0"></div>
        <div class="cell" data-i="1"></div>
        <div class="cell" data-i="2"></div>
        <div class="cell" data-i="3"></div>
        <div class="cell" data-i="4"></div>
        <div class="cell" data-i="5"></div>
        <div class="cell" data-i="6"></div>
        <div class="cell" data-i="7"></div>
        <div class="cell" data-i="8"></div>

        <!-- Win-line SVG overlay -->
        <svg class="wl-svg" id="wl-svg" xmlns="http://www.w3.org/2000/svg" style="display:none">
          <line id="wl-line" class="wl-path"/>
        </svg>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-next"  id="btn-next"  disabled>↺ Next Round</button>
      <button class="btn btn-ghost" id="btn-reset">Reset All</button>
      <button class="btn btn-mute"  id="btn-mute"  title="Toggle Sound">🔊</button>
    </div>

    <p class="footer">Two-player local · First to win 2 rounds takes the match</p>
  </div>

<script>
"use strict";
/* =============================================
   WINNING COMBOS
   ============================================= */
const COMBOS  = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const WIN_REQ = 2; // rounds needed to win a match

/* =============================================
   INJECT SVG MARKS INTO EACH CELL
   (ghost previews + animated active marks)
   ============================================= */
const cells = document.querySelectorAll('.cell');

cells.forEach(cell => {
  cell.innerHTML = `
    <!-- Faint ghost shown on hover for current player -->
    <svg class="ghost-svg ghost-x" viewBox="0 0 100 100">
      <line class="xl" x1="22" y1="22" x2="78" y2="78"/>
      <line class="xl" x1="78" y1="22" x2="22" y2="78"/>
    </svg>
    <svg class="ghost-svg ghost-o" viewBox="0 0 100 100">
      <circle class="oc" cx="50" cy="50" r="32"/>
    </svg>
    <!-- Animated draw-in marks (opacity toggled by JS) -->
    <svg class="mark-svg mark-x" viewBox="0 0 100 100">
      <line class="xl xl1" x1="22" y1="22" x2="78" y2="78"/>
      <line class="xl xl2" x1="78" y1="22" x2="22" y2="78"/>
    </svg>
    <svg class="mark-svg mark-o" viewBox="0 0 100 100">
      <circle class="oc" cx="50" cy="50" r="32"/>
    </svg>`;
});

/* =============================================
   STATE
   ============================================= */
let board   = Array(9).fill(null);
let curP    = 'x';           // current player
let rOver   = false;         // round over?
let mOver   = false;         // match over?
let rWins   = {x:0, o:0};   // round wins this match
let mDraws  = 0;             // draws this match
let rNum    = 1;             // 1–3
let allTime = {x:0, o:0, d:0};

/* =============================================
   DOM REFS
   ============================================= */
const grid       = document.getElementById('grid');
const statusEl   = document.getElementById('status');
const wlSvg      = document.getElementById('wl-svg');
const wlLine     = document.getElementById('wl-line');
const btnNext    = document.getElementById('btn-next');
const btnReset   = document.getElementById('btn-reset');
const btnMute    = document.getElementById('btn-mute');
const scX        = document.getElementById('sc-x');
const scO        = document.getElementById('sc-o');
const roundLabel = document.getElementById('round-label');
const matchOv    = document.getElementById('match-overlay');
const ovCard     = document.getElementById('ov-card');
const ovBigmark  = document.getElementById('ov-bigmark');
const ovH1       = document.getElementById('ov-h1');
const ovSub      = document.getElementById('ov-sub');
const appEl      = document.getElementById('app');
const flashEl    = document.getElementById('flash');

/* =============================================
   BACKGROUND STARFIELD
   ============================================= */
const bgCvs = document.getElementById('bg-canvas');
const bgCtx = bgCvs.getContext('2d');
let stars   = [];

function initStars() {
  bgCvs.width  = window.innerWidth;
  bgCvs.height = window.innerHeight;
  stars = Array.from({length: 130}, () => ({
    x:   Math.random() * bgCvs.width,
    y:   Math.random() * bgCvs.height,
    r:   Math.random() * 1.4 + 0.2,
    a:   Math.random(),
    da:  (Math.random() - 0.5) * 0.006,
    vx:  (Math.random() - 0.5) * 0.12,
    vy:  (Math.random() - 0.5) * 0.12,
    hue: [220, 270, 190, 300][Math.floor(Math.random() * 4)]
  }));
}

(function tickStars() {
  bgCtx.clearRect(0, 0, bgCvs.width, bgCvs.height);
  stars.forEach(s => {
    s.x = (s.x + s.vx + bgCvs.width)  % bgCvs.width;
    s.y = (s.y + s.vy + bgCvs.height) % bgCvs.height;
    s.a = Math.max(0.08, Math.min(1, s.a + s.da));
    if (s.a <= 0.08 || s.a >= 1) s.da *= -1;
    bgCtx.beginPath();
    bgCtx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    bgCtx.fillStyle = `hsla(${s.hue},80%,75%,${s.a * 0.55})`;
    bgCtx.fill();
  });
  requestAnimationFrame(tickStars);
})();

window.addEventListener('resize', initStars);
initStars();

/* =============================================
   PARTICLE / CONFETTI SYSTEM
   ============================================= */
const fxCvs = document.getElementById('fx-canvas');
const fxCtx = fxCvs.getContext('2d');
let parts   = [];
let fxRaf   = null;

function spawnBurst(cx, cy, color, n = 24) {
  fxCvs.width  = window.innerWidth;
  fxCvs.height = window.innerHeight;
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI*2/n)*i + (Math.random()-0.5)*0.6;
    const speed = 2.5 + Math.random()*5;
    parts.push({
      x: cx, y: cy,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      r: 2 + Math.random()*2.5,
      color, alpha: 1,
      decay: 0.022 + Math.random()*0.018,
      shape: Math.random()>0.5 ? 'c' : 'r',
      w: 5+Math.random()*5, h: 2+Math.random()*3,
      rot: Math.random()*Math.PI*2, spin: (Math.random()-0.5)*0.25
    });
  }
  if (!fxRaf) tickParts();
}

function spawnConfetti(n = 220) {
  fxCvs.width  = window.innerWidth;
  fxCvs.height = window.innerHeight;
  const pal = ['#ff2d55','#00e5ff','#ffd700','#8b5cf6','#00ff88','#ff9f00','#ff6bde'];
  for (let i = 0; i < n; i++) {
    parts.push({
      x:  fxCvs.width/2 + (Math.random()-0.5)*280,
      y:  -12,
      vx: (Math.random()-0.5)*12,
      vy: 4 + Math.random()*7,
      r:  0, color: pal[Math.floor(Math.random()*pal.length)],
      alpha: 1, decay: 0.007,
      shape: 'r', w: 7+Math.random()*6, h: 3+Math.random()*4,
      rot: Math.random()*Math.PI*2, spin: (Math.random()-0.5)*0.32,
      grav: 0.18
    });
  }
  if (!fxRaf) tickParts();
}

function tickParts() {
  fxCtx.clearRect(0, 0, fxCvs.width, fxCvs.height);
  parts = parts.filter(p => p.alpha > 0.02);
  parts.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += p.grav || 0.1;
    p.rot += p.spin; p.alpha -= p.decay;
    fxCtx.save();
    fxCtx.globalAlpha = p.alpha;
    fxCtx.translate(p.x, p.y); fxCtx.rotate(p.rot);
    fxCtx.fillStyle = p.color;
    if (p.shape === 'c') { fxCtx.beginPath(); fxCtx.arc(0,0,p.r,0,Math.PI*2); fxCtx.fill(); }
    else fxCtx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    fxCtx.restore();
  });
  fxRaf = parts.length > 0 ? requestAnimationFrame(tickParts) : null;
  if (!fxRaf) fxCtx.clearRect(0, 0, fxCvs.width, fxCvs.height);
}

function cellCenter(i) {
  const r = cells[i].getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}

/* =============================================
   SCREEN EFFECTS
   ============================================= */
function shake() {
  appEl.classList.remove('shake');
  void appEl.offsetWidth;
  appEl.classList.add('shake');
  setTimeout(() => appEl.classList.remove('shake'), 450);
}

function flash(which) {  // 'x' | 'o' | 'g' (gold)
  flashEl.className = '';
  void flashEl.offsetWidth;
  flashEl.className = `fx c${which === 'x' ? 'x' : which === 'o' ? 'o' : 'g'}`;
}

/* =============================================
   SOUND ENGINE  (Web Audio API – zero files)
   ============================================= */
let ac      = null;
let muted   = false;
let master  = null;

function getAC() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  return ac;
}

function getComp() {
  if (!master) {
    const a = getAC();
    master = a.createDynamicsCompressor();
    master.threshold.value = -14;
    master.connect(a.destination);
  }
  return master;
}

function tone(freq, t, dur, type='sine', vol=0.15, atk=0.005) {
  if (muted) return;
  const a = getAC();
  const o = a.createOscillator(), e = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  e.gain.setValueAtTime(0, t);
  e.gain.linearRampToValueAtTime(vol, t+atk);
  e.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(e); e.connect(getComp());
  o.start(t); o.stop(t+dur+0.01);
}

// Delay unit for echo-rich sounds
function mkDelay(dt=0.13, fb=0.38) {
  if (muted) return null;
  const a = getAC();
  const d = a.createDelay(2), f = a.createGain(), w = a.createGain();
  d.delayTime.value = dt; f.gain.value = fb; w.gain.value = 0.35;
  d.connect(f); f.connect(d); d.connect(w); w.connect(getComp());
  return d;
}

function toneD(freq, t, dur, type, vol, atk, dly) {
  if (muted) return;
  if (!dly) { tone(freq, t, dur, type, vol, atk); return; }
  const a = getAC();
  const o = a.createOscillator(), e = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  e.gain.setValueAtTime(0, t);
  e.gain.linearRampToValueAtTime(vol, t+atk);
  e.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(e); e.connect(dly); e.connect(getComp());
  o.start(t); o.stop(t+dur+0.6);
}

/* Individual sounds */
function sfxX() {
  if (muted) return;
  const a = getAC(), n = a.currentTime;
  tone(500, n,      0.04, 'square', 0.07, 0.002);
  tone(660, n+0.025, 0.11, 'sine',  0.14, 0.004);
  tone(820, n+0.065, 0.08, 'sine',  0.07, 0.003);
}

function sfxO() {
  if (muted) return;
  const a = getAC(), n = a.currentTime;
  tone(280, n,       0.04, 'square', 0.07, 0.002);
  tone(370, n+0.025, 0.14, 'sine',   0.14, 0.005);
  tone(450, n+0.08,  0.10, 'sine',   0.07, 0.004);
}

function sfxWin() {
  if (muted) return;
  const a = getAC(), n = a.currentTime;
  const d = mkDelay(0.12, 0.32);
  [[523,0],[659,.13],[784,.26],[1047,.40]].forEach(([f,dt]) =>
    toneD(f, n+dt, 0.2, 'sine', 0.18, 0.005, d));
}

function sfxMatchWin() {
  if (muted) return;
  const a = getAC(), n = a.currentTime;
  const d = mkDelay(0.08, 0.42);
  // Two-voice chord stabs
  [[523,659,0],[784,988,.14],[659,880,.28],[1047,1319,.44],[988,1568,.60],[1047,1319,.80],[1319,1760,1.0]].forEach(([f1,f2,dt]) => {
    toneD(f1, n+dt, 0.22, 'sine', 0.16, 0.004, d);
    toneD(f2, n+dt, 0.22, 'sine', 0.12, 0.004, d);
  });
}

function sfxDraw() {
  if (muted) return;
  const a = getAC(), n = a.currentTime;
  const o = a.createOscillator(), e = a.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(440, n);
  o.frequency.linearRampToValueAtTime(175, n+0.65);
  e.gain.setValueAtTime(0, n);
  e.gain.linearRampToValueAtTime(0.17, n+0.06);
  e.gain.exponentialRampToValueAtTime(0.0001, n+0.7);
  o.connect(e); e.connect(getComp());
  o.start(n); o.stop(n+0.75);
}

function sfxClick() {
  if (muted) return;
  const a = getAC(), n = a.currentTime;
  tone(620, n, 0.05, 'sine', 0.08, 0.002);
}

function sfxNext() {
  if (muted) return;
  const a = getAC(), n = a.currentTime;
  const o = a.createOscillator(), e = a.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(220, n);
  o.frequency.exponentialRampToValueAtTime(660, n+0.22);
  e.gain.setValueAtTime(0, n);
  e.gain.linearRampToValueAtTime(0.15, n+0.04);
  e.gain.exponentialRampToValueAtTime(0.0001, n+0.26);
  o.connect(e); e.connect(getComp());
  o.start(n); o.stop(n+0.3);
}

/* =============================================
   GAME HELPERS
   ============================================= */
function checkWin() {
  for (const [a,b,c] of COMBOS)
    if (board[a] && board[a]===board[b] && board[a]===board[c]) return [a,b,c];
  return null;
}

function setStatus(type, who) {
  statusEl.className = 'status pop';
  void statusEl.offsetWidth;
  if (type==='turn') {
    statusEl.innerHTML = `<span class="sm ${curP}">${curP.toUpperCase()}</span><span>'s turn</span>`;
  } else if (type==='win') {
    statusEl.innerHTML = `<span class="sm ${who}">${who.toUpperCase()}</span><span>wins round ${rNum}! 🎉</span>`;
  } else {
    statusEl.innerHTML = `<span>Round ${rNum} — Draw 🤝</span>`;
  }
}

function updatePips() {
  ['x','o'].forEach(p => {
    document.querySelectorAll(`#pips-${p} .pip`).forEach((pip, i) => {
      pip.className = i < rWins[p] ? `pip f${p}` : 'pip';
    });
  });
}

function countUp(el, to) {
  const from = parseInt(el.textContent) || 0;
  if (from === to) return;
  const dur = 380, t0 = performance.now();
  (function step(now) {
    const t = Math.min((now-t0)/dur, 1);
    const e = t<0.5 ? 2*t*t : -1+(4-2*t)*t; // ease in-out
    el.textContent = Math.round(from + (to-from)*e);
    if (t < 1) requestAnimationFrame(step);
  })(performance.now());
}

function updateNums() {
  countUp(document.getElementById('num-x'), allTime.x);
  countUp(document.getElementById('num-o'), allTime.o);
  countUp(document.getElementById('num-d'), allTime.d);
}

function drawWinLine(combo) {
  const gap = 10, sz = cells[0].offsetWidth, tot = sz*3+gap*2;
  const ctr = i => ({ x:(i%3)*(sz+gap)+sz/2, y:Math.floor(i/3)*(sz+gap)+sz/2 });
  const s = ctr(combo[0]), e = ctr(combo[2]);
  wlSvg.setAttribute('viewBox', `0 0 ${tot} ${tot}`);
  wlLine.setAttribute('x1',s.x); wlLine.setAttribute('y1',s.y);
  wlLine.setAttribute('x2',e.x); wlLine.setAttribute('y2',e.y);
  wlSvg.style.display = 'block';
  wlLine.style.animation = 'none';
  void wlLine.offsetWidth;
  wlLine.style.animation = '';
}

/* =============================================
   ANIMATE MARK (trigger draw-in on cell)
   ============================================= */
function animateMark(cell, p) {
  if (p === 'x') {
    const svg = cell.querySelector('.mark-x');
    svg.style.opacity = '1';
    const [l1, l2] = svg.querySelectorAll('.xl');
    l1.style.animation = l2.style.animation = 'none';
    void svg.offsetWidth;
    l1.style.animation = 'draw-mark 0.22s ease forwards';
    l2.style.animation = 'draw-mark 0.22s 0.16s ease forwards';
  } else {
    const svg = cell.querySelector('.mark-o');
    svg.style.opacity = '1';
    const circ = svg.querySelector('.oc');
    circ.style.animation = 'none';
    void svg.offsetWidth;
    circ.style.animation = 'draw-arc 0.38s ease forwards';
  }
}

/* =============================================
   RESET MARK SVGS ON A CELL
   ============================================= */
function resetCell(cell) {
  cell.className = 'cell';
  const mx = cell.querySelector('.mark-x');
  const mo = cell.querySelector('.mark-o');
  if (mx) {
    mx.style.opacity = '0';
    mx.querySelectorAll('line').forEach(l => { l.style.animation='none'; l.setAttribute('stroke-dashoffset','80'); });
  }
  if (mo) {
    mo.style.opacity = '0';
    mo.querySelectorAll('circle').forEach(c => { c.style.animation='none'; c.setAttribute('stroke-dashoffset','201'); });
  }
}

/* =============================================
   INIT ROUND
   ============================================= */
function initRound() {
  board = Array(9).fill(null);
  rOver = false; curP = 'x';
  cells.forEach(resetCell);
  wlSvg.style.display = 'none';
  grid.className = 'grid tx';
  grid.classList.remove('over');
  btnNext.disabled = true;
  scX.className = 'sc-card ax';
  scO.className = 'sc-card';
  roundLabel.textContent = `Round ${rNum} of 3`;
  setStatus('turn');
}

/* =============================================
   INIT MATCH
   ============================================= */
function initMatch() {
  rWins = {x:0,o:0}; mDraws = 0; rNum = 1; mOver = false;
  matchOv.classList.add('hidden');
  updatePips();
  initRound();
}

/* =============================================
   FULL RESET
   ============================================= */
function fullReset() {
  allTime = {x:0,o:0,d:0};
  ['num-x','num-o','num-d'].forEach(id => document.getElementById(id).textContent = '0');
  matchOv.classList.add('hidden');
  initMatch();
}

/* =============================================
   SHOW MATCH RESULT OVERLAY
   ============================================= */
function showResult(winner) {
  ovCard.className = winner ? `ov-card w${winner}` : 'ov-card wd';

  if (winner) {
    ovBigmark.textContent = winner === 'x' ? 'X' : 'O';
    ovBigmark.className   = `ov-bigmark ${winner}`;
    ovH1.textContent = `Player ${winner.toUpperCase()} wins the match!`;
    ovSub.textContent = `${rWins[winner]} rounds to none`;
    spawnConfetti(380);
    sfxMatchWin();
    flash('g');
  } else {
    ovBigmark.textContent = '—';
    ovBigmark.className   = 'ov-bigmark d';
    ovH1.textContent  = 'The match is a draw!';
    ovSub.textContent = 'All rounds ended in draws';
  }

  document.getElementById('ov-x').textContent = rWins.x;
  document.getElementById('ov-o').textContent = rWins.o;
  document.getElementById('ov-d').textContent = mDraws;
  matchOv.classList.remove('hidden');
}

/* =============================================
   CELL CLICK HANDLER — core game logic
   ============================================= */
function handleClick(e) {
  const cell  = e.currentTarget;
  const idx   = parseInt(cell.dataset.i, 10);
  if (board[idx] || rOver || mOver) return;

  // Place mark
  board[idx] = curP;
  cell.classList.add(curP, 'taken');
  animateMark(cell, curP);

  // Particle burst from cell
  const {x,y} = cellCenter(idx);
  spawnBurst(x, y, curP==='x' ? '#ff2d55' : '#00e5ff', 24);

  // Sound + ripple
  curP==='x' ? sfxX() : sfxO();
  cell.classList.add('ripple');
  setTimeout(() => cell.classList.remove('ripple'), 400);

  const wCombo = checkWin();

  if (wCombo) {
    /* -------- ROUND WIN -------- */
    rOver = true;
    grid.classList.add('over');
    wCombo.forEach(i => cells[i].classList.add('winner'));
    drawWinLine(wCombo);

    rWins[curP]++;
    allTime[curP]++;
    updateNums(); updatePips();
    setStatus('win', curP);
    sfxWin(); shake(); flash(curP);

    // Extra bursts on winning cells
    wCombo.forEach(i => {
      const {x,y} = cellCenter(i);
      spawnBurst(x, y, curP==='x' ? '#ff2d55' : '#00e5ff', 14);
    });
    spawnConfetti(140);

    scX.className = curP==='x' ? 'sc-card ax' : 'sc-card';
    scO.className = curP==='o' ? 'sc-card ao' : 'sc-card';

    if (rWins[curP] >= WIN_REQ) {
      mOver = true;
      setTimeout(() => showResult(curP), 1450);
    } else {
      rNum++;
      btnNext.disabled = false;
    }

  } else if (board.every(v => v !== null)) {
    /* -------- DRAW -------- */
    rOver = true;
    grid.classList.add('over');
    mDraws++; allTime.d++;
    updateNums();
    setStatus('draw'); sfxDraw();
    scX.className = scO.className = 'sc-card';
    rNum++;

    if (rNum > 3) {
      mOver = true;
      setTimeout(() => showResult(null), 1100);
    } else {
      btnNext.disabled = false;
    }

  } else {
    /* -------- NEXT PLAYER -------- */
    curP = curP==='x' ? 'o' : 'x';
    grid.className = `grid t${curP}`;
    setStatus('turn');
    scX.className = curP==='x' ? 'sc-card ax' : 'sc-card';
    scO.className = curP==='o' ? 'sc-card ao' : 'sc-card';
  }
}

/* =============================================
   EVENT LISTENERS
   ============================================= */
cells.forEach(c => c.addEventListener('click', handleClick));

btnNext.addEventListener('click', () => {
  if (!rOver || mOver) return;
  sfxNext(); initRound();
});

btnReset.addEventListener('click', () => { sfxClick(); fullReset(); });

btnMute.addEventListener('click', () => {
  muted = !muted;
